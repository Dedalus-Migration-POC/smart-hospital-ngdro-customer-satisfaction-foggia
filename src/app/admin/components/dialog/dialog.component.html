<ng-template #yesOrNo>
  <div class="inline-buttons">
    <button mat-flat-button mat-dialog-close (click)="confirm()">{{ data.onConfirmLabel ?? ('yes' | translate) }}
    </button>
    <button mat-raised-button mat-dialog-close
            (click)="cancel()">{{ data.onCancelLabel ?? ('no' | translate) }}
    </button>
  </div>
</ng-template>

<div class="head">
  <img alt="" [ngSrc]="'assets/images/icon_popup_' + data.type + '.svg'" height="75" width="75"/>
  <span class="title">{{ data.title ?? ('dialog.default-title.' + data.type | translate) }}</span>
</div>

<div *ngIf="data.type === 'error' || data.text" class="content">
  {{ data.type === 'error' ? (data.text ?? 'dialog.default-content.error' | translate) : data.text }}
</div>

<div class="actions">
  <ng-container [ngSwitch]="data.type">
    <ng-container *ngSwitchCase="'attention'">
      <ng-container *ngTemplateOutlet="yesOrNo"></ng-container>
    </ng-container>
    <ng-container *ngSwitchDefault>
      <button mat-flat-button mat-dialog-close (click)="confirm()">{{ data.onConfirmLabel ?? 'OK' }}</button>
      <button *ngIf="data.onCancel" mat-raised-button mat-dialog-close
              (click)="cancel()">{{ data.onCancelLabel ?? ('cancel' | translate) }}
      </button>
    </ng-container>
  </ng-container>
</div>
