<ng-template #ready>
  <div id="content">
    <router-outlet></router-outlet>
  </div>
</ng-template>


<main>
  <app-header></app-header>
  <app-scaffold *ngIf="(initializing$ | async) || (initializeError$ | async); else ready"
                [loading]="initializing$"
                [error]="initializeError$"
                (onErrorRetryCallback)="initialize()"
  ></app-scaffold>
</main>
