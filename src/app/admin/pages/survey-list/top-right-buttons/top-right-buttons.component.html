<div>
  <h4>{{ 'admin.survey-list.title' | translate }}</h4>
</div>

<div>
  <button
    mat-stroked-button
    (click)="print()"
    [disabled]="!(surveys$ | async)?.length"
  >
    <mat-icon>print</mat-icon>
    <span>{{ 'admin.survey-list.print-surveys-btn' | translate }}</span>
  </button>

  <button mat-stroked-button (click)="viewAnalytics()">
    <img src="assets/images/area_chart.png" alt="" style="margin-right: 8px" />
    <span>{{ 'admin.survey-list.view-analytics-btn' | translate }}</span>
  </button>

  <button
    id="create-survey-btn"
    mat-flat-button
    routerLink="/survey-form"
    [disabled]="!(sections$ | async)?.length"
  >
    <mat-icon>add</mat-icon>
    <span>{{ 'admin.survey-list.create-survey-btn' | translate }}</span>
  </button>
</div>
