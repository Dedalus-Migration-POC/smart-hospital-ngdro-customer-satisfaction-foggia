<ng-template
  #publishStatusButton
  let-survey="survey"
  let-operatingStatus="operatingStatus"
>
  <mat-spinner *ngIf="operatingStatus && operatingStatus.surveyId === survey.id && operatingStatus.status === SurveyOperatingStatus.PUBLISHING_UNPUBLISHING;
      else notPublishing" diameter="20"></mat-spinner>
  <ng-template #notPublishing>
    <ng-container [ngSwitch]="survey.status">
      <button mat-icon-button *ngSwitchCase="'ACTIVE'" (click)="unpublishSurvey.emit(survey)">
        <mat-icon [matTooltip]="'admin.survey-list.actions-hints.unpublish' | translate">public_off</mat-icon>
      </button>
      <button mat-icon-button *ngSwitchCase="'INACTIVE'" (click)="publishSurvey.emit(survey)">
        <mat-icon [matTooltip]="'admin.survey-list.actions-hints.publish' | translate">public</mat-icon>
      </button>
    </ng-container>
  </ng-template>
</ng-template>

<ng-template
  #editStatusButton
  let-survey="survey"
  let-operatingStatus="operatingStatus"
>
  <ng-container *ngIf="survey.status === SurveyStatus.ACTIVE ? 'clone' : 'edit'; let mode">
    <mat-spinner *ngIf="operatingStatus && operatingStatus.surveyId === survey.id && operatingStatus.status === SurveyOperatingStatus.CLONING;
      else notEditing" diameter="20"></mat-spinner>
    <ng-template #notEditing>
      <button mat-icon-button (click)="onEdit(survey)" [disabled]="survey.deleted">
        <mat-icon
          [matTooltip]="'admin.survey-list.actions-hints.' + mode | translate"
          [style]="{visibility: survey.deleted ? 'hidden' : undefined}"
        >{{ survey.status === SurveyStatus.ACTIVE ? 'file_copy' : 'edit' }}
        </mat-icon>
      </button>
    </ng-template>
  </ng-container>
</ng-template>

<ng-template
  #deleteStatusButton
  let-survey="survey"
  let-operatingStatus="operatingStatus"
>
  <mat-spinner *ngIf="operatingStatus && operatingStatus.surveyId === survey.id && operatingStatus.status === SurveyOperatingStatus.DELETING_RESTORING;
      else notDeleting" diameter="20"></mat-spinner>
  <ng-template #notDeleting>
    <button
      mat-icon-button
      [style]="{visibility: survey.status === 'ACTIVE' ? 'hidden' : undefined}"
      (click)="changeDeletedStatus(survey)">
      <mat-icon
        [matTooltip]="'admin.survey-list.actions-hints.' + (survey.deleted ? 'restore' : 'delete') | translate">{{ survey.deleted ? 'restore' : 'delete' }}
      </mat-icon>
    </button>
  </ng-template>
</ng-template>

<app-survey-filter></app-survey-filter>

<mat-table [dataSource]="(datasource$ | async)!" class="mat-elevation-z8">
  @for (surveyProperty of columns; track surveyProperty) {
    <ng-container *ngIf="surveyProperty !== 'actions'" [matColumnDef]="surveyProperty">
      <mat-header-cell *matHeaderCellDef>
        {{ 'admin.survey-list.table-headers.' + surveyProperty | translate }}
      </mat-header-cell>
      <mat-cell *matCellDef="let survey" [class]="survey.status" [class.deleted]="survey.deleted">
        {{ handleColumn(survey, surveyProperty) }}
      </mat-cell>
    </ng-container>
  }

  <ng-container *ngIf="columns.includes('actions')" [matColumnDef]="'actions'">
    <mat-header-cell *matHeaderCellDef>
      {{ 'admin.survey-list.table-headers.actions' | translate }}
    </mat-header-cell>
    <mat-cell *matCellDef="let element">
      <ng-container
        *ngTemplateOutlet="
        editStatusButton;
        context: {survey: element, operatingStatus: operatingStatus$ | async}"
      ></ng-container>

      <ng-container
        *ngTemplateOutlet="
        deleteStatusButton;
        context: { survey: element, operatingStatus: operatingStatus$ | async }"
      ></ng-container>

      <ng-container [ngSwitch]="element.status" *ngIf="!element.deleted">
        <ng-container
          *ngTemplateOutlet="
          publishStatusButton;
          context: { survey: element, operatingStatus: operatingStatus$ | async }"
        ></ng-container>
      </ng-container>

    </mat-cell>
  </ng-container>

  <mat-header-row *matHeaderRowDef="columns"></mat-header-row>
  <mat-row *matRowDef="let row; columns: columns"></mat-row>

</mat-table>


<mat-paginator [pageSizeOptions]="(pageSizeOptions$ | async)!"></mat-paginator>
