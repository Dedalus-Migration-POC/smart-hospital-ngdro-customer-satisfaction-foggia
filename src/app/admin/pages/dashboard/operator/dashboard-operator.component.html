<app-scaffold [loading]="loading$" [error]="of(false)">
  <div class="content">
    <mat-card *ngIf="!(loading$ | async)">
      <div class="card-head">
        <h6>{{ 'admin.operator-dashboard.title' | translate : {department: 'departmentHere'} }}</h6>
        <button mat-stroked-button (click)="viewAnalytics()">
          <img ngSrc="assets/images/area_chart.png" alt="" style="margin-right: 8px" height="13" width="14"/>
          <span>{{ 'admin.survey-list.view-analytics-btn' | translate }}</span>
        </button>
      </div>
      <ng-container *ngIf="data$ | async as data">
        <app-print-survey [data]="data"></app-print-survey>
      </ng-container>
      <button class="print-btn" mat-flat-button (click)="print()">
        {{ ((printSurveyComponent?.printing$ | async) ? 'admin.print-survey-dialog.printing' : 'admin.print-survey-dialog.button') | translate }}
      </button>
    </mat-card>
  </div>
</app-scaffold>
