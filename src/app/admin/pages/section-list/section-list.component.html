<div class="head">
  <h6>{{ 'admin.section-list.title' | translate }}</h6>
  <button mat-flat-button routerLink="/section-form"
          class="create-section-btn"
          [style]="{width: createSurveyBtn ? createSurveyBtn.clientWidth + 'px' : undefined}"
  >
    <mat-icon>add</mat-icon>
    <span>{{ 'admin.section-list.create-section-btn' | translate }}</span>
  </button>
</div>

<app-section-filter></app-section-filter>

<app-section-list-table
  (onEdit)="onEdit($event)"
  (onDelete)="onDelete($event)"
  (onRestore)="onRestore($event)"
></app-section-list-table>
