<div class="head">
  <h4>{{ 'admin.section-list.title' | translate }}</h4>
  <button
    mat-flat-button
    routerLink="/section-form"
    class="create-section-btn"
    [style]="{
      width: createSurveyBtn ? createSurveyBtn.clientWidth + 'px' : undefined,
    }"
  >
    <mat-icon>add</mat-icon>
    <span>{{ 'admin.section-list.create-section-btn' | translate }}</span>
  </button>
</div>

<div class="wrapper" style="width: 100%; overflow: auto; display: flex">
  <div style="width: 100%; min-width: 640px">
    <app-section-filter></app-section-filter>

    <app-section-list-table
      (onEdit)="onEdit($event)"
      (onDelete)="onDelete($event)"
      (onRestore)="onRestore($event)"
    ></app-section-list-table>
  </div>
</div>
