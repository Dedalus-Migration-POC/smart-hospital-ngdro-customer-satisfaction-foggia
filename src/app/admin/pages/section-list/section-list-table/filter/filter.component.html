<form [formGroup]="form" class="section-filter">
  <div>
    <mat-form-field appearance="outline" floatLabel="always">
      <mat-label>{{ 'admin.section-list.search-filter.name' | translate }}</mat-label>
      <input matInput type="text" [formControl]="form.controls.name"/>
    </mat-form-field>

    <mat-form-field appearance="outline" floatLabel="always">
      <mat-label>{{ 'admin.section-list.search-filter.version' | translate }}</mat-label>
      <mat-select
        [formControl]="form.controls.version"
        [value]="form.controls.version.value"
      >
        <mat-option *ngFor="let version of (versions$ | async)" [value]="version">
          {{ version }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" floatLabel="always">
      <mat-label>{{ 'admin.section-list.search-filter.present-in' | translate }}</mat-label>
      <mat-select
        [formControl]="form.controls.presentIn"
        [value]="form.controls.presentIn.value"
      >
        <mat-option *ngFor="let option of (presentInOptions$ | async)" [value]="option.id">
          {{ option.value }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <div>
    <button type="button" mat-icon-button (click)="form.reset()">
      <mat-icon [matTooltip]="'admin.section-list.search-filter.clear-filter-btn' | translate">close</mat-icon>
    </button>

    <app-toggle-button
      *ngIf="canShowDeleted$ | async"
      (onClick)="toggleDeleted()"
      [activeTooltip]="'admin.section-list.search-filter.show-deleted-btn' | translate"
      [inactiveTooltip]="'admin.section-list.search-filter.hide-deleted-btn' | translate"
      [isActive]="(showDeleted$ | async) ?? false"
      activeIcon="delete"
      inactiveIcon="restore"
    ></app-toggle-button>
  </div>
</form>
