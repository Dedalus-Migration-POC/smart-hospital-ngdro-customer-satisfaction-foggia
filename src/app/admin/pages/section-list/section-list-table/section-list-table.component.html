<mat-progress-bar mode="indeterminate" *ngIf="(state$ | async)?.fetchingSections"></mat-progress-bar>
<mat-table
  matSort
  [dataSource]="dataSource"
  class="mat-elevation-z8"
>
  @for (column of columns; track column) {
    <ng-container *ngIf="column !== 'actions'" [matColumnDef]="column">
      <mat-header-cell *matHeaderCellDef mat-sort-header [disabled]="column === 'present-in'">
        {{ 'admin.section-list.table-headers.' + column | translate }}
      </mat-header-cell>
      <mat-cell *matCellDef="let element" [class.deleted]="element.deleted">
        {{ handleColumn(element, column) }}
      </mat-cell>
    </ng-container>
  }

  <ng-container *ngIf="columns.includes('actions')" [matColumnDef]="'actions'">
    <mat-header-cell *matHeaderCellDef>
      {{ 'admin.section-list.table-headers.actions' | translate }}
    </mat-header-cell>
    <mat-cell *matCellDef="let element">
      <button mat-icon-button (click)="onEdit.emit(element)">
        <mat-icon [matTooltip]="'admin.section-list.actions-hints.edit' | translate">edit</mat-icon>
      </button>
      <ng-template #idle>
        <button mat-icon-button (click)="changeDeletedStatus(element)">
          <mat-icon
            [matTooltip]="'admin.section-list.actions-hints.' + (element.deleted ? 'restore' : 'delete') | translate">{{ element.deleted ? 'restore' : 'delete' }}
          </mat-icon>
        </button>
      </ng-template>
      <mat-spinner *ngIf="(deletingId$ | async) === element.id?.toString(); else idle" diameter="20"></mat-spinner>
    </mat-cell>
  </ng-container>

  <mat-header-row *matHeaderRowDef="columns"></mat-header-row>
  <mat-row *matRowDef="let row; columns: columns"></mat-row>
</mat-table>


<mat-paginator #secPaginator
               [pageSize]="pageSize"
               [pageIndex]="pageIndex"
               [length]="length"
               [pageSizeOptions]="[5, 10, 20]"></mat-paginator>
