<div class="cover">
  <img
    id="login_illustration"
    src="assets/images/illustration_login.svg"
    [alt]="'header.name' | translate"
  />

  <div style="display: flex; flex-direction: column">
    <img
      ngSrc="assets/images/logo.png"
      [alt]="'header.name' | translate"
      height="48"
      width="168"
    />
    <span class="title">Accedi alla dashboard</span>
  </div>

  <form [formGroup]="form" (ngSubmit)="login()">
    <mat-form-field appearance="outline">
      <mat-label>{{ 'admin.login.form.username' | translate }}</mat-label>
      <input matInput type="text" [formControl]="form.controls.username" />
      <mat-error *ngIf="form.controls.username.hasError('required')"
        >{{
          'admin.print-survey-dialog.form-validations.required-field'
            | translate
        }}
      </mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline" style="margin-top: 10px">
      <mat-label>{{ 'admin.login.form.password' | translate }}</mat-label>
      <input matInput type="text" [formControl]="form.controls.password" />
      <mat-error *ngIf="form.controls.username.hasError('required')"
        >{{
          'admin.print-survey-dialog.form-validations.required-field'
            | translate
        }}
      </mat-error>
    </mat-form-field>
    <button mat-flat-button>
      {{ 'admin.login.form.submit-btn' | translate }}
    </button>
    <button
      mat-flat-button
      type="button"
      (click)="login()"
      [style]="{ backgroundColor: '#d4d4d4', color: '#000' }"
    >
      Operatore
    </button>
  </form>
</div>
