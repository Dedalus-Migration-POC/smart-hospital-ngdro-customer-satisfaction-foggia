<div class="card-wrapper card-teaser-wrapper justify-content-center">
  <div class="card card-teaser">
    <div class="card-body">
      <h1 class="card-title h2">
        {{ 'otp.title' | translate: { questType: questType } }}
      </h1>
      <p class="card-text fs-6" [innerHTML]="'otp.info' | translate"></p>

      <div
        class="go-to-evaluate"
        [innerHTML]="
          'otp.go-to-evaluate'
            | translate: { unit: unit, structureType: structureType }
        "
      ></div>
      <h2 class="h5">{{ 'otp.authentication' | translate }}</h2>

      <form [formGroup]="otpInputForm" class="mt-3">
        <div class="form-floating mb-3" id="it-input-description">
          <input
            required
            type="text"
            class="form-control"
            formControlName="otp"
            id="otp"
            [placeholder]="'otp.insert-otp' | translate"
          />
          <label for="otp">{{ 'otp.input-label' | translate }}</label>
          <div
            *ngIf="!this.otpInputForm.value.otp && showError"
            class="disabled-error"
          >
            <it-icon name="error" [color]="'danger'"></it-icon>
            {{ 'otp.otp-error' | translate }}
          </div>
        </div>

        <div class="form-check">
          <input
            id="consent"
            type="checkbox"
            formControlName="consent"
            required
          />
          <label for="consent" class="mb-0">
            <span id="consent-help"
              >{{ 'otp.consent' | translate }}
              <button
                type="button"
                class="btn p-0 consent-info-button"
                (click)="consentMadal.toggle()"
              >
                {{ 'otp.consent-link' | translate }}
              </button>
              {{ 'otp.consent-2' | translate }}
            </span></label
          >
          <div
            *ngIf="this.otpInputForm.value.consent === false && showError"
            class="disabled-error"
          >
            <it-icon name="error" [color]="'danger'"></it-icon>
            {{ 'otp.consent-error' | translate }}
          </div>
        </div>

        <button
          class="mt-3"
          type="button"
          itButton="primary"
          [disabled]="(questionnaireLoading$ | async)!"
          (click)="submit()"
          [attr.aria-label]="
            otpInputForm.invalid || otpInputForm.value.consent === false
              ? ('otp.access-button-disabled-description' | translate)
              : ('otp.access-button-description' | translate)
          "
        >
          {{ 'otp.access-button' | translate }}
        </button>
      </form>
    </div>
  </div>

  <it-modal #consentMadal="itModal" size="xl">
    <ng-container modalTitle>{{
      'otp.consent-modal-title' | translate
    }}</ng-container>

    <p class="consent-body">{{ 'otp.consent-modal-body' | translate }}</p>

    <ng-container footer>
      <button
        itButton="outline-primary"
        size="sm"
        type="button"
        data-bs-dismiss="modal"
        [attr.aria-label]="'otp.consent-modal-close-description' | translate"
      >
        {{ 'otp.consent-modal-close' | translate }}
      </button>
      <button
        itButton="primary"
        size="sm"
        [attr.aria-label]="'otp.consent-modal-accept-description' | translate"
        type="button"
        data-bs-dismiss="modal"
        (click)="onAccept()"
      >
        {{ 'otp.consent-modal-accept' | translate }}
      </button>
    </ng-container>
  </it-modal>
</div>
