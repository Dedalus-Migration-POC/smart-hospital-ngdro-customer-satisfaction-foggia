<div class="card-wrapper card-teaser-wrapper justify-content-center">
  <div class="card card-teaser">
    <div class="card-body">
      <h1 class="card-title h2">
        {{ 'otp.title' | translate: { questType: questType } }}
      </h1>
      <p class="card-text fs-6" [innerHTML]="'otp.info' | translate"></p>

      <div
        class="go-to-evaluate"
        [innerHTML]="
          structureType === 'ambulatorio'
            ? ('otp.go-to-evaluate-ambulatory'
              | translate: { unit: unit, structureType: structureType })
            : ('otp.go-to-evaluate-department'
              | translate: { unit: unit, structureType: structureType })
        "
      ></div>
      <h2 class="h5">{{ 'otp.authentication' | translate }}</h2>

      <form [formGroup]="otpInputForm" class="mt-3">
        <div class="mb-3" id="it-input-description">
          <label for="otp" class="otp-input-label">{{
            'otp.input-label' | translate
          }}</label>
          <input
            required
            type="text"
            class="form-control fw-bold"
            formControlName="otp"
            id="otp"
          />

          <div
            *ngIf="!this.otpInputForm.value.otp && showError"
            class="disabled-error"
          >
            <it-icon name="error" [color]="'danger'"></it-icon>
            {{ 'otp.otp-error' | translate }}
          </div>
        </div>

        <div
          class="select-wrapper form-floating age-select mt-5 mb-4"
          id="age-select"
        >
          <label for="ageSelect" class="age-select-label"
            >Seleziona la tua fascia di età</label
          >
          <select id="ageSelect" required formControlName="ageSelect">
            <option selected="" value=""></option>
            <option value="18 - 30">18 - 30</option>
            <option value="31 - 45">31 - 45</option>
            <option value="46 - 60">46 - 60</option>
            <option value="61 +">61 +</option>
          </select>
          <div
            *ngIf="!this.otpInputForm.value.ageSelect && showError"
            class="disabled-error"
          >
            <it-icon name="error" [color]="'danger'"></it-icon>
            {{ 'otp.ageSelect-error' | translate }}
          </div>
        </div>

        <div class="form-check">
          <input
            id="consent"
            type="checkbox"
            formControlName="consent"
            required
          />
          <label for="consent" class="mb-0 consent-help">
            <span>
              {{ 'otp.consent' | translate }}

              <a [routerLink]="['#']" class="consent-link">
                {{ 'otp.consent-link' | translate }}
              </a>
              {{ 'otp.consent-2' | translate }}
            </span>
          </label>
          <div
            *ngIf="this.otpInputForm.value.consent === false && showError"
            class="disabled-error"
          >
            <it-icon name="error" [color]="'danger'"></it-icon>
            {{ 'otp.consent-error' | translate }}
          </div>
        </div>

        <button
          class="mt-3 submit-button"
          type="button"
          itButton="primary"
          [disabled]="(questionnaireLoading$ | async)!"
          (click)="submit()"
        >
          {{ 'otp.access-button' | translate }}
        </button>
      </form>
    </div>
  </div>
