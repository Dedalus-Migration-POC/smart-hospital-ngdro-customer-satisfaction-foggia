<form [formGroup]="formGroup" class="ps-0 mt-4">
  <div *ngFor="let question of questions" class="quest-row">
    <fieldset [id]="question.id" class="fieldset-quest-options" required>
      <div class="fieldset-quest-options-legend">
        <legend class="question-title">
          {{ question.name }}
        </legend>
        <span
          *ngIf="getError(question.id)"
          class="quest-error"
          aria-live="polite"
          [id]="'required-' + question.id"
        >
          <it-icon name="error" [color]="'danger'"></it-icon>
          {{ 'quest.quest-error-required' | translate }}
        </span>
      </div>
      <div class="quest-options">
        <div
          class="form-check form-check-inline"
          *ngFor="let vote of question?.answers"
        >
          <input
            type="radio"
            [formControlName]="question.id"
            [attr.name]="question.id"
            [id]="question.id + '-' + vote.id"
            [value]="vote.id"
          />
          <label [for]="question.id + '-' + vote.id">
            {{ vote.name }}
          </label>
        </div>
      </div>
    </fieldset>
  </div>

  <div class="buttons-container">
    <button
      itButton="outline-primary"
      type="button"
      class=""
      [disabled]="activeStep === 0"
      (click)="goBack()"
      [attr.aria-label]="
        previousSectionTitle
          ? ('quest.back-button-description'
            | translate: { questName: previousSectionTitle })
          : null
      "
    >
      <it-icon
        name="arrow-left"
        [color]="'primary'"
        class="back-button-arrow"
      ></it-icon>
      {{ 'back' | translate }}
    </button>
    <button
      itButton="outline-primary"
      *ngIf="!showConfirmButton"
      type="button"
      class=""
      (click)="goForward()"
      [attr.aria-label]="
        nextSectionTitle
          ? ('quest.forward-button-description'
            | translate: { questName: nextSectionTitle })
          : null
      "
    >
      {{ 'forward' | translate }}
      <it-icon
        name="arrow-right"
        [color]="'primary'"
        class="forward-button-arrow"
      ></it-icon>
    </button>
    <button
      [disabled]="(sendQuestionnaireLoading$ | async)!"
      itButton="primary"
      *ngIf="showConfirmButton"
      type="button"
      class=""
      (click)="onSubmit()"
    >
      {{ 'send' | translate }}
    </button>
  </div>
</form>
