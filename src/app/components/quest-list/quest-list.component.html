<form [formGroup]="formGroup" class="ps-0 mt-4">
  <div *ngFor="let question of questionsList" class="quest-row">
    <div class="question-title">
      {{ question.title }}
      <div *ngIf="getError(question.id)" class="quest-error">
        <it-icon name="error" [color]="'danger'"></it-icon>
        {{ 'quest.quest-error-required' | translate }}
      </div>
    </div>
    <fieldset [id]="question.id" class="quest-options">
      <legend class="d-none">{{ question.title }}</legend>
      <div class="form-check form-check-inline" *ngFor="let vote of votes">
        <input
          type="radio"
          [formControlName]="question.id"
          [attr.name]="question.id"
          [id]="question.id + '-' + vote"
          [value]="vote"
        />
        <label [for]="question.id + '-' + vote">{{
          'quest.vote.' + vote | translate
        }}</label>
      </div>
    </fieldset>
  </div>

  <div class="buttons-container">
    <button
      itButton="outline-primary"
      type="button"
      class="ms-5"
      [disabled]="activeStep === 0"
      (click)="goBack()"
      [attr.aria-label]="'back' | translate"
    >
      <it-icon
        name="arrow-left"
        [color]="'primary'"
        class="back-button-arrow"
      ></it-icon>
      {{ 'back' | translate }}
    </button>
    <button
      itButton="outline-primary"
      *ngIf="!showConfirmButton"
      type="button"
      class="me-5"
      (click)="goForward()"
      [attr.aria-label]="
        formGroup.invalid
          ? ('quest.forward-button-disabled-description' | translate)
          : ('forward' | translate)
      "
    >
      {{ 'forward' | translate }}
      <it-icon
        name="arrow-right"
        [color]="'primary'"
        class="forward-button-arrow"
      ></it-icon>
    </button>
    <button
      [disabled]="(sendQuestionnaireLoading$ | async)!"
      itButton="primary"
      *ngIf="showConfirmButton"
      type="button"
      class="me-5"
      (click)="onSubmit()"
      [attr.aria-label]="
        formGroup.invalid
          ? ('quest.forward-button-disabled-description' | translate)
          : ('quest.send-button-description' | translate)
      "
    >
      {{ 'send' | translate }}
    </button>
  </div>
</form>
