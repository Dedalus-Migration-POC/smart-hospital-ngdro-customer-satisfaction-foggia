<app-loading-full-screen *ngIf="loading$ | async"></app-loading-full-screen>

<app-error-card
  *ngIf="(error$ | async)?.flag && !surveyName"
  [type]="(error$ | async)?.type"
></app-error-card>

<app-otp-card
  *ngIf="unit && surveyName"
  [structureType]="
    structureType.toUpperCase() === 'AMBULATORY' ? 'ambulatorio' : 'reparto'
  "
  [unit]="unit"
  [questType]="surveyName"
  (sendOtp)="sendOtp($event)"
></app-otp-card>
