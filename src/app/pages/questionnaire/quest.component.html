<app-error-card
  *ngIf="(questionnaireError$ | async)?.flag && !(questionnaire$ | async)"
  [type]="(questionnaireError$ | async)?.type"
></app-error-card>

<app-feedback *ngIf="isSurveyConfirmed$ | async"></app-feedback>
<ng-container
  *ngIf="
    !(isSurveyConfirmed$ | async) &&
    (questionnaire$ | async)?.survey as questionnaire
  "
>
  <h1 class="h2 mt-5 mb-3">
    {{ questionnaire.name }}
  </h1>

  <it-steppers-container
    [activeStep]="activeStep"
    [showForwardButton]="false"
    [showConfirmButton]="false"
    showBackButton="false"
  >
    <it-steppers-item
      *ngFor="
        let section of questionnaire?.sections;
        index as i;
        let last = last;
        let first = first
      "
      [label]="'0' + (i + 1) + '. ' + section.name"
    >
      <div class="container">
        <h2 class="h3">{{ section.name }}</h2>
        <div class="required-tag">{{ 'quest.required-tag' | translate }}</div>
        <app-quest-list
          [title]="questionnaire?.name!"
          [id]="questionnaire?.id!"
          [surveySessionId]="surveySessionId"
          [questions]="section.questions"
          [sectionTitle]="section.name"
          [nextSectionTitle]="!last ? questionnaire.sections[i + 1].name : null"
          [previousSectionTitle]="
            !first ? questionnaire.sections[i - 1].name : null
          "
          [sectionId]="section.id"
          [activeStep]="activeStep"
          [showConfirmButton]="
            activeStep === (questionnaire?.sections)!.length - 1
          "
          (onForwardClick)="onForwardClick()"
          (onBackClick)="onBackClick($event)"
        ></app-quest-list>
      </div>
    </it-steppers-item>
  </it-steppers-container>
</ng-container>
